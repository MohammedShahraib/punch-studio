.pw{position:relative}.pw input{padding-right:76px}.eye{position:absolute;right:4px;top:4px;min-height:40px;padding:0 12px;border:0;background:transparent;font-weight:600;cursor:pointer;color:var(--ink)}
.ct{border:2px solid var(--ink);border-radius:8px;padding:18px;margin:20px 0;max-width:520px}.ct p{margin:4px 0}
html{scroll-behavior:smooth}
#lb{position:fixed;top:0;left:0;height:3px;background:var(--lime);width:0;z-index:50;box-shadow:0 0 0 1px var(--ink)}#lb.go{animation:lb .5s ease-out}@keyframes lb{0%{width:0;opacity:1}90%{width:100%;opacity:1}100%{width:100%;opacity:0}}
.hero h1 i{display:block;font-style:normal}.hero h1 i,.hero h1 span{animation:up .7s cubic-bezier(.2,.7,.2,1) both}.hero h1 span{animation-delay:.15s}@keyframes up{from{opacity:0;transform:translateY(40%)}to{opacity:1;transform:none}}

@media(hover:hover){a.card:hover,button.card:hover{transform:translateY(-4px)}button.card:hover .thumb svg{transform:scale(1.06)}button.card:hover{border-color:var(--ink);box-shadow:5px 5px 0 var(--lime)}}
button.card{transition:transform .2s,box-shadow .2s}
.ba{position:relative;aspect-ratio:6/5;border-radius:6px;overflow:hidden;background:#111}.ba>div{position:absolute;inset:0}.ba svg{width:100%;height:100%;display:block}.dv{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:var(--lime)}.bt{position:absolute;bottom:8px;font-size:11px;font-weight:600;background:#fff;padding:1px 8px;border-radius:3px;color:#111}.bt.l{left:8px}.bt.r{right:8px;background:var(--lime)}

const SVC=[["Left chest logo","Small-format logos for polos and shirts. Fine detail needs enough size to stitch cleanly."],["Cap / hat","Planned for curved, structured crowns and the seam running through the front."],["Jacket back","Large designs with stitch density and fabric pull planned across a bigger area."],["3D puff","Raised foam lettering and shapes. Best with bold, simple artwork."],["Embroidery patch","Borders and fills prepared for patch production."],["Custom logo","Something else? Send it and we’ll tell you what’s possible."]];
const CATS=[["All","All"],["Left chest","Left chest"],["Cap","Caps & hats"],["3D puff","3D puff"],["Jacket","Jacket backs"],["Patch","Patches"],["Monogram","Text & monograms"]];
const WORK=[["Left chest","Monogram polo mark","3 in wide","Fill with a satin outline, sized so small letters stay readable.","PS"],["Left chest","Initials badge","3.5 in wide","Two-letter lockup with clean spacing.","NK"],["Cap","Wordmark on twill cap","2.25 in tall","Satin letters over a fill underlay, centered across the cap seam.","PUNCH"],["Cap","Star emblem cap","2 in wide","Simple fill shapes planned for a curved front.","★"],["3D puff","Bold block initials","2.5 in tall","Foam under satin. Bold shapes only; fine detail won’t puff.","BX"],["3D puff","Puff cap wordmark","2.25 in tall","Raised lettering on a structured cap.","FIT"],["Jacket","Back lettering","10 in wide","Large satin letters, density tuned for fleece.","RIDE"],["Jacket","Crest back piece","11 in wide","Fill center with a satin border.","K9"],["Patch","Round crest patch","3.5 in","Fill center with a satin border for patch production.","LS"],["Patch","Badge patch","3 in","Square badge with a merrowed-style border.","77"],["Monogram","Script name","3.5 in wide","Thin script is hard to stitch small, so it’s shown larger.","Aria"],["Monogram","Circle monogram","3 in","Three-letter monogram inside a ring.","ABC"]];
const DEF=`<defs><pattern id="th" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="3" height="3" fill="#D9FF45"/><path d="M0 0V3" stroke="#a9c91e" stroke-width="1.2"/></pattern><filter id="bl"><feGaussianBlur stdDeviation=".7"/></filter></defs>`;
function art(w,mode="after"){const c=w[0],t=w[4],a=mode==="after",L=t.length,fs=L>4?17:L>3?20:L>2?24:30,fill=a?"url(#th)":"#8a8a8a",st=a?'stroke="#111" stroke-width=".7" paint-order="stroke"':'filter="url(#bl)"';
const tx=(x,y,s,o="")=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="${s}" fill="${fill}" ${st} ${o}>${t}</text>`;
let g=a?'<rect width="120" height="100" fill="#111"/>':'<rect width="120" height="100" fill="#fff"/>';
if(a){if(c==="Left chest")g+=`<path d="M26 24l22-9q12 9 24 0l22 9 8 22-15 6v38H33V52l-15-6z" fill="#2b2b2b"/>`+tx(76,46,Math.min(fs,13));
else if(c==="Cap")g+=`<path d="M14 68q0-46 46-46t46 46z" fill="#2b2b2b"/><path d="M8 68h104q0 9-52 9T8 68z" fill="#1c1c1c"/><path d="M60 22v46" stroke="#111" stroke-width="1"/>`+tx(60,52,Math.min(fs,22));
else if(c==="Jacket")g+=`<path d="M24 14h24q12 8 24 0h24l6 12v62H18V26z" fill="#2b2b2b"/>`+tx(60,58,fs*1.15);
else if(c==="Patch")g+=`<circle cx="60" cy="50" r="40" fill="#2b2b2b"/><circle cx="60" cy="50" r="37" fill="none" stroke="url(#th)" stroke-width="5"/>`+tx(60,58,fs);
else if(c==="3D puff")g+=`<rect x="18" y="18" width="84" height="64" rx="8" fill="#2b2b2b"/>`+[3,2,1].map(d=>tx(60+d*.6,60+d*.9,fs*1.2,'opacity=".9" style="filter:brightness(.45)"')).join("")+tx(60,60,fs*1.2);
else g+=`<rect x="18" y="14" width="84" height="72" rx="10" fill="#2b2b2b"/><circle cx="60" cy="50" r="30" fill="none" stroke="url(#th)" stroke-width="3"/>`+tx(60,58,fs*.9)}
else g+=tx(60,58,fs*1.2);
return `<svg viewBox="0 0 120 100" role="img" aria-label="${a?"Stitched concept sample":"Flat artwork before digitizing"}: ${esc(t)}">${DEF}${g}</svg>`}
const P={
"/":()=>`<section class="hero dark"><div class="w"><div><h1><i>Your logo.</i><span>Ready to stitch.</span></h1><p>Send your artwork and get a quote for embroidery digitizing: left-chest logos, caps, jacket backs, patches and 3D puff.</p><div class="row"><a class="btn lime" href="#/quote">Get a Free Quote</a><a class="btn ghost" href="#/portfolio">View Our Work</a></div></div>

<section class="sec"><div class="w"><h2>Services</h2><div class="grid" style="margin-top:24px">${SVC.map(([t,d])=>`<a class="card" href="#/services"><h3>${t}</h3><p>${d}</p></a>`).join("")}</div>
<div class="note">Stitch quality depends on artwork, fabric, size and machine settings. We don’t promise identical results for every design.</div></div></section>
<section class="sec gray"><div class="w"><h2>How it works</h2><ol class="steps" style="margin-top:24px"><li><b>Send artwork</b>Upload your logo with size, garment and format.</li><li><b>Get a quote</b>We review it and reply with price and turnaround.</li><li><b>We digitize</b>Your design is prepared for your machine format.</li><li><b>Review</b>Check the result and ask for revisions.</li></ol></div></section>
<section class="sec"><div class="w"><h2>Why Punch Studio</h2><div class="grid" style="margin-top:24px"><div class="card"><h3>Digitizing only</h3><p>One job, done with attention.</p></div><div class="card"><h3>Honest quotes</h3><p>Pricing is set per design after we see the artwork.</p></div><div class="card"><h3>Your machine format</h3><p>${CFG.formats.join(", ")} (confirm yours).</p></div></div></div></section>
<section class="sec dark"><div class="w"><h2>Have a logo?</h2><p style="color:#ccc">Tell us what you need stitched.</p><a class="btn lime" href="#/quote">Get a Free Quote</a></div></section>`,
"/services":()=>`<section class="sec"><div class="w"><h1 style="font-size:clamp(2.6rem,10vw,5rem)">Services</h1><p style="max-width:40em;color:var(--mute)">Every design is reviewed by a person before we quote. Results depend on artwork, fabric, size and machine settings, so we can’t guarantee a perfect outcome for every design.</p><div class="grid" style="margin-top:24px">${SVC.map(([t,d])=>`<div class="card"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div><p style="margin-top:28px"><a class="btn lime" href="#/quote">Get a Free Quote</a></p></div></section>`,

"/about":()=>`<section class="sec"><div class="w legal"><h1 style="font-size:clamp(2.6rem,10vw,5rem)">About</h1><p>PUNCH STUDIO prepares artwork for embroidery machines. You send a logo, we review it, quote it, and deliver a stitch file in the format your machine reads.</p><h2>Our process</h2><p>We check artwork quality, plan stitch types, density and underlay for the fabric and size, then export your format. Revisions are available; the scope is confirmed in your quote.</p><div class="note">PLACEHOLDER: add your real company story, location and team here. Add only what is true.</div><a class="btn lime" href="#/quote">Get a Free Quote</a></div></section>`,
"/faq":()=>`<section class="sec"><div class="w legal"><h1 style="font-size:clamp(2.6rem,10vw,5rem)">FAQ</h1>${[["What is embroidery digitizing?","It’s converting artwork into a stitch file that tells an embroidery machine where and how to stitch."],["Which file formats are available?",`${CFG.formats.join(", ")}. Tell us your machine and we’ll confirm.`],["Can I request 3D puff?","Yes. Puff works best with bold shapes and larger lettering."],["How do I submit my logo?","Use the quote form and attach PNG, JPG, PDF, SVG or AI files up to "+CFG.maxMB+" MB."],["How are pricing and turnaround set?","By size, stitch complexity, embroidery type and workload. We confirm both in your quote."],["Can I request revisions?","Yes. Revision terms are stated in your quote."]].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div></section>`,
"/contact":()=>`<section class="sec"><div class="w"><h1 style="font-size:clamp(2.6rem,10vw,5rem)">Contact</h1><div class="ct"><h3>PUNCH STUDIO</h3><p><b>${CFG.owner}</b></p><p>Phone / WhatsApp: ${phoneHtml}</p><p>Email: <a href="mailto:${CFG.email}">${CFG.email}</a></p></div><div class="row" style="margin:20px 0">${waBtn()}<a class="btn" href="mailto:${CFG.email}">Email us</a></div>${WA?"":`<div class="note">The WhatsApp button turns on once the correct country code is set in the settings (waCountryCode).</div>`}<h2 style="font-size:1.8rem;margin:24px 0 8px">Business hours</h2><table>${CFG.hours.map(([d,t])=>`<tr><td>${d}</td><td>${t}</td></tr>`).join("")}</table><h2 style="font-size:1.8rem;margin:28px 0 12px">Send a message</h2>${form("c")}</div></section>`,
"/quote":()=>`<section class="sec"><div class="w"><h1 style="font-size:clamp(2.6rem,10vw,5rem)">Get a quote</h1><p style="color:var(--mute);max-width:40em">Tell us about your design. Files: ${CFG.ext.join(", ").toUpperCase()}, up to ${CFG.maxMB} MB. Other formats (for example PSD, CDR, GIF) aren’t accepted.</p>${form("q")}</div></section>`,
"/legal":()=>`<section class="sec"><div class="w legal"><h1 style="font-size:clamp(2.6rem,10vw,5rem)">Privacy &amp; Terms</h1><div class="note">Draft for review. Have these checked by a qualified person and add your business details before launch.</div><h2>Privacy</h2><p>We collect the details you give us (name, email, WhatsApp number, artwork, project notes) only to reply to your request and deliver your quote or files. We don’t sell your data. You can ask us to delete it at any time by contacting ${esc(CFG.email)}.</p><h2>Terms</h2><p>Quotes state price, turnaround and revision scope. Embroidery results depend on artwork, fabric, size and machine settings, so we don’t guarantee identical outcomes. You confirm you have the right to use the artwork you send.</p></div></section>`};
